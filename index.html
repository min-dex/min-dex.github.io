    <style>
      html,
      body {
        min-height: 100%;
        margin: 0;
        background: var(--mindex-boot-bg, #181816);
        color: var(--mindex-boot-ink, #f3f3ef);
        color-scheme: dark;
      }
      html[data-theme="dark"] { color-scheme: dark; }
      html[data-theme="light"] {
        --mindex-boot-bg: #ffffff;
        --mindex-boot-ink: #101010;
        color-scheme: light;
      }
      body.ui-booting { background: var(--mindex-boot-bg, #181816); }
      .mindex-boot {
        position: fixed;
        inset: 0;
        z-index: 10000;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 20px;
        background: var(--mindex-boot-bg, #181816);
        color: var(--mindex-boot-ink, #f3f3ef);
        pointer-events: none;
        opacity: 0;
        visibility: hidden;
        transition: opacity 220ms ease-out, visibility 0s 220ms;
      }
      body.ui-booting .mindex-boot {
        opacity: 1;
        visibility: visible;
        transition: none;
      }
      .mindex-boot-cross { width: 45px; height: 55px; color: #ff8bc2; }
      html[data-theme="light"] .mindex-boot-cross { color: #b8467d; }
      .mindex-boot-wordmark {
        padding-left: .22em;
        font: 700 22px/1 system-ui, sans-serif;
        letter-spacing: .22em;
      }
      .mindex-boot-cross { animation: mindex-boot-reveal 500ms ease-in-out both; }
      .mindex-boot-wordmark { animation: mindex-boot-reveal 500ms ease-in-out both; }
      @keyframes mindex-boot-reveal {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      html.presenter-output-document .mindex-boot { display: none; }
      @media (prefers-reduced-motion: reduce) {
        .mindex-boot { transition: none; }
        :is(.mindex-boot-cross, .mindex-boot-wordmark) { animation: none; }
      }
      body.ui-booting .app-shell,
      body.ui-booting .toast-region {
        visibility: hidden;
      }
      body[data-boot-failed="true"] :is(.app-shell, .app-shell *, .toast-region) { visibility: hidden !important; }
      .mindex-boot-error {
        position: fixed; inset: 0; z-index: 10001;
        display: grid; place-content: center; justify-items: center; gap: 20px;
        padding: 24px; box-sizing: border-box;
        background: var(--mindex-boot-bg, #181816);
        color: var(--mindex-boot-ink, #f3f3ef);
        font: 500 16px/1.5 system-ui, sans-serif; text-align: center;
      }
      .mindex-boot-error[hidden], html.presenter-output-document .mindex-boot-error { display: none; }
      .mindex-boot-error p { margin: 0; }
      .mindex-boot-error button {
        padding: 10px 20px; border: 1px solid currentColor; border-radius: 5px;
        background: transparent; color: inherit; font: inherit; cursor: pointer;
      }
      html.presenter-output-document,
      html.presenter-output-document body,
      body.presenter-output-body {
        margin: 0;
        background: #000;
      }
      html.presenter-output-pending body { visibility: hidden; }
    </style>
    <script>
      (() => {
        let savedTheme = "";
        try { savedTheme = localStorage.getItem("mindex.theme"); } catch (_) {}
        const theme = savedTheme === "dark" || savedTheme === "light"
          ? savedTheme
          : window.matchMedia?.("(prefers-color-scheme: dark)")?.matches ? "dark" : "light";
        document.documentElement.dataset.theme = theme;
        const params = new URLSearchParams(window.location.search);
        if (params.get("output") === "presenter" || params.get("mindex-output") === "presenter") {
          document.documentElement.classList.add("presenter-output-document", "presenter-output-pending");
        }
        let presenterController = false;
        try { presenterController = sessionStorage.getItem("mindex.ui.module") === "presenter"; } catch (_) {}
        if (document.documentElement.classList.contains("presenter-output-document") || presenterController) {
          for (const weight of ["6SemiBold", "7Bold", "8ExtraBold"]) {
            const font = document.createElement("link");
            font.rel = "preload"; font.as = "font"; font.type = "font/woff2"; font.crossOrigin = "anonymous";
            font.href = `./vendor/fonts/freesentation/Freesentation-${weight}.woff2`;
            document.head.append(font);
          }
        }
      })();
    </script>

            if (moduleName === "presenter") {

    <script>
      (() => {
        const fallbackVersion = "20261017-visible-preview-fit";
        const modules = [
          "vendor/lucide.min.js", "vendor/supabase-js.min.js",
          "mindex.constants.js", "mindex.inline-text.js", "mindex.design-tokens.js", "mindex.worship-model.js",
          "mindex.worship-persistence.js", "mindex.presenter.js",
          "mindex.pptx.js", "mindex.worship-input.js", "mindex.song-timing.js",
          "mindex.presenter-ui.js", "mindex.worship-week.js", "mindex.setlist-links.js",
          "mindex.manuals.js", "mindex.bulletin.js", "mindex.worship-source.js", "scripture-editions.js", "app.js",
          "mindex.db-refresh.js", "mindex.monitor.js", "mindex.scripture-repair-display.js",
        ];
        const styles = [
          "styles.css", "styles.presenter-output.css", "styles.bulletin.css",
          "styles.calendar.css", "styles.monitor.css",
        ];
        const retryUrl = new URL(location.href);
        const retry = retryUrl.searchParams.get("mindex-retry");
        const retryStamp = /^\d{1,16}$/.test(retry || "") ? retry : "";
        if (retryStamp) {
          retryUrl.searchParams.delete("mindex-retry");
          history.replaceState(history.state, "", retryUrl.href);
        }
        const assetUrl = (path, version) => {
          const url = path.startsWith("vendor/") ? `./${path}` : `./${path}?v=${encodeURIComponent(version)}`;
          // A manual retry must not reuse a browser-cached failed preload.
          return retryStamp ? `${url}${url.includes("?") ? "&" : "?"}retry=${retryStamp}` : url;
        };
        const preloadScript = (path, version) => {
          const preload = document.createElement("link");
          preload.rel = "preload";
          preload.as = "script";
          preload.href = assetUrl(path, version);
          if (path === "app.js") preload.fetchPriority = "high";
          document.head.append(preload);
        };
        const failBoot = (error) => {
          console.error(error);
          document.body.dataset.bootFailed = "true";
          document.body.classList.remove("ui-booting");
          document.getElementById("bootError").hidden = false;
        };
        window.MINDEX_BOOT_FAIL = failBoot;
        const load = (path, version) => new Promise((resolve, reject) => {
          const script = document.createElement("script");
          script.src = assetUrl(path, version);
          const timer = setTimeout(() => finish(new Error(`${path} 응답 시간이 초과되었습니다.`)), 15000);
          const finish = (error) => {
            clearTimeout(timer); script.onload = script.onerror = null;
            if (error) { script.remove(); reject(error); } else resolve();
          };
          script.onload = () => finish();
          script.onerror = () => finish(new Error(`${path}을 불러오지 못했습니다.`));
          document.body.append(script);
        });
        const loadStyle = (path, version) => new Promise((resolve, reject) => {
          const stylesheet = document.createElement("link");
          stylesheet.rel = "stylesheet";
          stylesheet.href = assetUrl(path, version);
          const timer = setTimeout(() => finish(new Error(`${path} 응답 시간이 초과되었습니다.`)), 15000);
          const finish = (error) => {
            clearTimeout(timer); stylesheet.onload = stylesheet.onerror = null;
            if (error) { stylesheet.remove(); reject(error); } else resolve();
          };
          stylesheet.onload = () => finish();
          stylesheet.onerror = () => finish(new Error(`${path}을 불러오지 못했습니다.`));
          document.head.append(stylesheet);
        });
        const resolveVersion = async () => {
          const controller = new AbortController();
          const timer = setTimeout(() => controller.abort(), 3000);
          try {
            const response = await fetch(`./mindex-release.json?t=${Date.now()}`, { cache: "no-store", signal: controller.signal });
            const release = await response.json();
            return /^[0-9A-Za-z._-]{4,80}$/.test(String(release?.version || "")) ? release.version : fallbackVersion;
          } catch {
            return fallbackVersion;
          } finally {
            clearTimeout(timer);
          }
        };
        void (async () => {
          const version = await resolveVersion();
          window.MINDEX_RELEASE = version;
          modules.forEach((module) => preloadScript(module, version));
          await Promise.all(styles.map((style) => loadStyle(style, version)));
          for (const module of modules) await load(module, version);
        })().catch(failBoot);
      })();
    </script>
  </body>

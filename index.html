          : window.matchMedia?.("(prefers-color-scheme: dark)")?.matches ? "dark" : "light";
        document.documentElement.dataset.theme = theme;
        const params = new URLSearchParams(window.location.search);

          document.documentElement.classList.add("presenter-output-document", "presenter-output-pending");

          const weights = controller ? ["5Medium", "6SemiBold", "7Bold", "8ExtraBold"] : ["6SemiBold", "7Bold", "8ExtraBold"];

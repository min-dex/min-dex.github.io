name: Actions artifact cleanup

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'
  push:
    branches: [codex/actions-artifact-retention]
    paths: [.github/workflows/artifact-cleanup.yml]

permissions:
  contents: read
  actions: write

concurrency:
  group: actions-artifact-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Remove completed large build duplicates
        uses: actions/github-script@v7
        with:
          script: |
            const minimumBytes = 100 * 1024 * 1024;
            // A completed workflow has no remaining downstream artifact consumer.
            // Keep a short grace period for API/eventual-consistency delays only.
            const cutoff = Date.now() - 10 * 60 * 1000;
            const disposable = /^(?:mindex-(?:mac|win)-(?:test|internal|signed)|github-pages)$/;
            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              { owner: context.repo.owner, repo: context.repo.repo, per_page: 100 },
            );
            const runStatus = new Map();
            let deleted = 0;
            let bytes = 0;
            for (const artifact of artifacts) {
              if (!disposable.test(artifact.name)
                  || artifact.size_in_bytes < minimumBytes
                  || Date.parse(artifact.updated_at) > cutoff
                  || artifact.expired) continue;
              const runId = artifact.workflow_run?.id;
              if (!runId || Number(runId) === Number(context.runId)) continue;
              if (!runStatus.has(runId)) {
                const { data: run } = await github.rest.actions.getWorkflowRun({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: runId,
                });
                runStatus.set(runId, run.status);
              }
              if (runStatus.get(runId) !== 'completed') continue;
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifact.id,
              });
              deleted += 1;
              bytes += artifact.size_in_bytes;
            }
            const gib = (bytes / 1024 / 1024 / 1024).toFixed(2);
            core.summary
              .addHeading('Actions artifact cleanup')
              .addTable([
                [{ data: 'Deleted', header: true }, { data: 'Reclaimed', header: true }],
                [String(deleted), `${gib} GiB`],
              ]);
            await core.summary.write();
            core.notice(`Deleted ${deleted} completed large artifacts (${gib} GiB).`);

name: Isolated children sidebar trace
on:
  push:
    branches: [diagnostic/children-sidebar-linux]
permissions:
  contents: read
jobs:
  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: bash cloud/setup.sh
      - run: MINDEX_SMOKE_OFFLINE=1 .cache/cloud-venv/bin/python tests/smoke_citation_sidebar.py

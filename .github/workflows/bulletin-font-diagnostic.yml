name: Bulletin font diagnostic
on:
  push:
    branches: [diagnostic/bulletin-font-linux]
permissions:
  contents: read
jobs:
  font-metrics:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: bash cloud/setup.sh
      - run: .cache/cloud-venv/bin/python tests/smoke_bulletin_print_reference.py

name: Windows candidate install and upgrade
on:
  push:
    branches: [codex/windows-upgrade-6d6092044]
permissions:
  contents: read
jobs:
  upgrade:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      OLD: befc873058a92e7f64cde06146a979f0aa684556
      NEW: 6d60920443b1257ce285277d600c487085349e7a
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/windows-upgrade-check
          path: qa
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: befc873058a92e7f64cde06146a979f0aa684556
          path: app
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          package_json_file: app/package.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright
      - name: Build previous test installer
        working-directory: app
        run: |
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          pnpm electron:test:win
      - name: Install previous version and seed fixture
        run: python qa/tools/windows-upgrade-check/check.py before
      - uses: actions/checkout@v4
        with:
          ref: 6d60920443b1257ce285277d600c487085349e7a
          path: app
          persist-credentials: false
      - name: Build exact candidate
        working-directory: app
        run: |
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          pnpm electron:test:win
      - uses: actions/upload-artifact@v4
        with:
          name: Mindex-Test-Windows-x64-6d6092044
          path: app/dist/test/*.exe
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Install over previous version and compare server records
        run: python qa/tools/windows-upgrade-check/check.py after

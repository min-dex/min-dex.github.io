name: Static delivery diagnostic
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tools/probe_static_delivery.py
      - .github/workflows/static-delivery-diagnostic.yml
permissions:
  contents: read
jobs:
  public-static-files:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.58.0
      - run: python -m playwright install --with-deps chromium
      - run: python tools/probe_static_delivery.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: static-delivery
          path: output/startup-network/static-delivery.json
          retention-days: 7

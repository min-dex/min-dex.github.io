name: Cloud web checks
on:
  pull_request:
  push:
    branches: [main, codex/mindex-presenter-handoff]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-web:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: bash cloud/setup.sh
      - run: .cache/cloud-venv/bin/python cloud/check.py

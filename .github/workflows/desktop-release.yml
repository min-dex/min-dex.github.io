name: Desktop Packages

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Build signed packages and upload to a DRAFT release
        type: boolean
        default: false
  push:
    branches: [codex/mindex-presenter-handoff]
    paths:
      - .github/workflows/desktop-release.yml
      - electron-builder.test.cjs

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: mac
            os: macos-15
          - platform: win
            os: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      - run: pnpm electron:check
      - name: Build isolated unsigned test installers
        if: ${{ !inputs.publish_release }}
        run: pnpm electron:test:${{ matrix.platform }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Build signed packages (no public release)
        if: ${{ inputs.publish_release }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CSC_LINK: ${{ matrix.platform == 'mac' && secrets.CSC_LINK || secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ matrix.platform == 'mac' && secrets.CSC_KEY_PASSWORD || secrets.WIN_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_CONTENTS: ${{ secrets.APPLE_API_KEY_CONTENTS }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          BUILD_PLATFORM: ${{ matrix.platform }}
        run: |
          if [[ "$BUILD_PLATFORM" == mac ]]; then
            test -n "$APPLE_API_KEY_CONTENTS" || { echo 'Missing APPLE_API_KEY_CONTENTS'; exit 1; }
            export APPLE_API_KEY="$RUNNER_TEMP/notary-key.p8"
            printf '%s' "$APPLE_API_KEY_CONTENTS" > "$APPLE_API_KEY"
            chmod 600 "$APPLE_API_KEY"
            trap 'rm -f "$APPLE_API_KEY"' EXIT
          fi
          node scripts/verify-release.mjs --platform="$BUILD_PLATFORM"
          if [[ "$BUILD_PLATFORM" == mac ]]; then
            pnpm exec electron-builder --mac dmg zip --arm64 --x64 --publish never -c.forceCodeSigning=true
          else
            pnpm exec electron-builder --win nsis --x64 --publish never -c.forceCodeSigning=true
          fi
      - name: Upload packages without renaming update assets
        uses: actions/upload-artifact@v4
        with:
          name: mindex-${{ matrix.platform }}-${{ inputs.publish_release && 'signed' || 'test' }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.blockmap
            dist/latest*.yml
            dist/test/*.dmg
            dist/test/*.exe

  draft-release:
    if: ${{ inputs.publish_release }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: mindex-*-signed
          path: release-artifacts
          merge-multiple: true
      - name: Create draft for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="$(node -p 'require("./package.json").version')"
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo 'A release with this version already exists. Increment package.json version.' >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo 'Tag already exists. Use a new desktop version.' >&2
            exit 1
          fi
          test -f release-artifacts/latest-mac.yml
          test -f release-artifacts/latest.yml
          gh release create "$tag" release-artifacts/* --target "$GITHUB_SHA" --draft --title "Mindex $tag" --notes 'Signed desktop packages. Validate upgrade and presenter output before publishing.'

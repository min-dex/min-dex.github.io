name: Desktop Packages

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Build signed packages and upload to a DRAFT release
        type: boolean
        default: false
  push:
    branches: [main, codex/mindex-presenter-handoff, codex/native-*]
    paths:
      - .github/workflows/desktop-release.yml
      - electron-builder.test.cjs
      - electron-builder.internal.cjs
      - internal-release.json
      - scripts/publish-internal.py
      - tests/test_internal_updater.cjs
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - tools/broadcast-engine/**
      - tools/broadcast-prototype/**
      - electron/**
      - mindex.presenter-lifetime.js
      - mindex.icons.js
      - tools/minimatch-compat/**
      - tests/verify_candidate_package.cjs
      - tests/test_desktop_youtube_local.cjs
      - tests/test_desktop_upgrade.cjs
      - tests/verify_published_upgrade.py
      - tests/cleanup_desktop_ci.py
      - tests/install_test_fixture.py
      - tests/test_electron_updater.cjs
      - tests/test_minimatch_compat.cjs
      - tests/test_electron_test_isolation.cjs
      - tests/test_electron_runtime_files.py
      - scripts/release-electron.mjs
      - tests/test_release_preflight.mjs
      - scripts/verify-release.mjs
      - scripts/product-identity.cjs
      - scripts/packaged-encoder-identity.cjs
      - product-release.json

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: mac
            os: macos-15
          - platform: win
            os: windows-latest
    steps:
      - name: Preserve source bytes on Windows
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Use the runner volume for disposable Windows test files
        if: runner.os == 'Windows'
        shell: bash
        run: |
          printf 'TEMP=%s\nTMP=%s\n' "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=moderate
      - run: python tools/broadcast-engine/prepare.py
      - run: pnpm electron:check
      - name: Check native build disk budget
        shell: bash
        run: |
          python - <<'PYDISK'
          import shutil
          free=shutil.disk_usage('.').free
          print('Free GiB:',round(free/2**30,1),'estimated peak additional GiB: 12')
          if free < 32*2**30: raise SystemExit('Insufficient room for native candidates; preserve evidence and stop')
          PYDISK
      - name: Prepare prior-version TEST installation with synthetic records
        if: ${{ !inputs.publish_release }}
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm install --prefix "$RUNNER_TEMP/mindex-qa" --ignore-scripts --no-audit --no-fund playwright@1.58.0
          export NODE_PATH="$(node -p 'require("path").join(process.env.RUNNER_TEMP, "mindex-qa", "node_modules")')"
          if [[ "$RUNNER_OS" == Windows ]]; then
            pnpm exec electron-builder --config electron-builder.test.cjs --win nsis --x64 --publish never -c.extraMetadata.version=0.9.0-test -c.directories.output=dist/prior-test
            installer="dist/prior-test/Mindex-Test-0.9.0-test-win-x64.exe"
          else
            arch="$(node -p process.arch)"
            pnpm exec electron-builder --config electron-builder.test.cjs --mac dmg --"$arch" --publish never -c.extraMetadata.version=0.9.0-test -c.directories.output=dist/prior-test
            installer="dist/prior-test/Mindex-Test-0.9.0-test-mac-$arch.dmg"
          fi
          python tests/install_test_fixture.py "$installer" "$RUNNER_TEMP/install-fixture.json"
          exe="$(node -p 'JSON.parse(require("fs").readFileSync(require("path").join(process.env.RUNNER_TEMP,"install-fixture.json"))).exe')"
          node tests/test_desktop_upgrade.cjs "$exe" "$RUNNER_TEMP/upgrade-proof.json" seed "$GITHUB_SHA" 0.9.0-test
          node tests/test_desktop_upgrade.cjs "$exe" "$RUNNER_TEMP/upgrade-proof.json" restart "$GITHUB_SHA" 0.9.0-test
          rm -rf dist/prior-test
      - name: Build isolated unsigned test installers
        if: ${{ !inputs.publish_release }}
        run: pnpm electron:test:${{ matrix.platform }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify candidate renderer and exercise local RTMPS
        if: ${{ !inputs.publish_release }}
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/mindex-qa" --ignore-scripts --no-audit --no-fund playwright@1.58.0
          export NODE_PATH="$(node -p 'require("path").join(process.env.RUNNER_TEMP, "mindex-qa", "node_modules")')"
          if [[ "$RUNNER_OS" == Windows ]]; then
            resources="dist/test/win-unpacked/resources"
            node tests/verify_candidate_package.cjs "$resources" win-x64
            node tests/test_desktop_youtube_local.cjs "$PWD/dist/test/win-unpacked/Mindex Test.exe" "$PWD/$resources/broadcast-engine/ffmpeg.exe"
          else
            arm="dist/test/mac-arm64/Mindex Test.app/Contents"
            intel="dist/test/mac/Mindex Test.app/Contents"
            node tests/verify_candidate_package.cjs "$arm/Resources" mac-arm64
            node tests/verify_candidate_package.cjs "$intel/Resources" mac-x64
            if [[ "$(uname -m)" == arm64 ]]; then app="$arm"; else app="$intel"; fi
            node tests/test_desktop_youtube_local.cjs "$PWD/$app/MacOS/Mindex Test" "$PWD/$app/Resources/broadcast-engine/ffmpeg"
          fi
      - name: Install candidate over TEST fixture and verify preservation
        if: ${{ !inputs.publish_release }}
        shell: bash
        run: |
          version="$(node -p 'require("./package.json").version')"
          export NODE_PATH="$(node -p 'require("path").join(process.env.RUNNER_TEMP, "mindex-qa", "node_modules")')"
          if [[ "$RUNNER_OS" == Windows ]]; then
            installer="dist/test/Mindex-Test-${version}-test-win-x64.exe"
          else
            installer="dist/test/Mindex-Test-${version}-test-mac-$(node -p process.arch).dmg"
          fi
          python tests/install_test_fixture.py "$installer" "$RUNNER_TEMP/install-fixture.json"
          exe="$(node -p 'JSON.parse(require("fs").readFileSync(require("path").join(process.env.RUNNER_TEMP,"install-fixture.json"))).exe')"
          node tests/test_desktop_upgrade.cjs "$exe" "$RUNNER_TEMP/upgrade-proof.json" upgrade "$GITHUB_SHA" "${version}-test"
          node tests/test_desktop_upgrade.cjs "$exe" "$RUNNER_TEMP/upgrade-proof.json" restart "$GITHUB_SHA" "${version}-test"
      - name: Retain verified TEST installers before cleanup
        if: ${{ !inputs.publish_release }}
        uses: actions/upload-artifact@v4
        with:
          name: mindex-${{ matrix.platform }}-${{ inputs.publish_release && 'signed' || 'test' }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.blockmap
            dist/latest*.yml
            dist/test/*.dmg
            dist/test/*.exe

      - name: Remove completed TEST fixtures and reproducible builds
        if: ${{ !inputs.publish_release }}
        run: python tests/cleanup_desktop_ci.py test
      - name: Build and verify church internal installers without publication
        if: ${{ !inputs.publish_release }}
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          version="$(node -p 'require("./package.json").version')"
          export NODE_PATH="$(node -p 'require("path").join(process.env.RUNNER_TEMP, "mindex-qa", "node_modules")')"
          if [[ "$RUNNER_OS" == Windows ]]; then
            pnpm exec electron-builder --config electron-builder.internal.cjs --win nsis --x64 --publish never
            installer="dist/internal/Mindex-${version}-win-x64.exe"
            target=win-x64
          else
            pnpm exec electron-builder --config electron-builder.internal.cjs --mac dmg --arm64 --x64 --publish never
            node scripts/packaged-encoder-identity.cjs mac-arm64 "dist/internal/mac-arm64/Mindex.app" dist/internal/encoder-mac-arm64.json
            node scripts/packaged-encoder-identity.cjs mac-x64 "dist/internal/mac/Mindex.app" dist/internal/encoder-mac-x64.json
            target="mac-$(node -p process.arch)"
            installer="dist/internal/Mindex-${version}-$target.dmg"
          fi
          python tests/install_test_fixture.py "$installer" "$RUNNER_TEMP/internal-install.json" internal
          exe="$(node -p 'JSON.parse(require("fs").readFileSync(require("path").join(process.env.RUNNER_TEMP,"internal-install.json"))).exe')"
          if [[ "$RUNNER_OS" == Windows ]]; then resources="$(dirname "$exe")/resources"; else resources="$(dirname "$(dirname "$exe")")/Resources"; fi
          if [[ "$RUNNER_OS" == macOS ]]; then codesign --verify --deep --strict "$(dirname "$(dirname "$(dirname "$exe")")")"; fi
          node tests/verify_candidate_package.cjs "$resources" "$target" internal
          if [[ "$RUNNER_OS" == Windows ]]; then encoder="$resources/broadcast-engine/ffmpeg.exe"; else encoder="$resources/broadcast-engine/ffmpeg"; fi
          node tests/test_desktop_youtube_local.cjs "$exe" "$encoder"
          node tests/test_desktop_upgrade.cjs "$exe" "$RUNNER_TEMP/internal-proof.json" seed "$GITHUB_SHA" "$version"
          python tests/install_test_fixture.py "$installer" "$RUNNER_TEMP/internal-install.json" internal
          node tests/test_desktop_upgrade.cjs "$exe" "$RUNNER_TEMP/internal-proof.json" upgrade "$GITHUB_SHA" "$version"
          node tests/test_desktop_upgrade.cjs "$exe" "$RUNNER_TEMP/internal-proof.json" restart "$GITHUB_SHA" "$version"
          python tests/cleanup_desktop_ci.py internal
          python tests/verify_published_upgrade.py "$installer" "$target" "$GITHUB_SHA" "$version"
      - name: Retain published-version upgrade receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: published-upgrade-${{ matrix.platform }}
          path: ${{ runner.temp }}/published-upgrade-*/*proof.json
          if-no-files-found: warn
          retention-days: 14
      - name: Retain verified church installers
        if: ${{ !inputs.publish_release }}
        uses: actions/upload-artifact@v4
        with:
          name: mindex-${{ matrix.platform }}-internal
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          path: |
            dist/internal/*.dmg
            dist/internal/*.exe
            dist/internal/encoder-*.json
      - name: Build signed packages (no public release)
        if: ${{ inputs.publish_release }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CSC_LINK: ${{ matrix.platform == 'mac' && secrets.CSC_LINK || secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ matrix.platform == 'mac' && secrets.CSC_KEY_PASSWORD || secrets.WIN_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_CONTENTS: ${{ secrets.APPLE_API_KEY_CONTENTS }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          BUILD_PLATFORM: ${{ matrix.platform }}
        run: |
          if [[ "$BUILD_PLATFORM" == mac ]]; then
            test -n "$APPLE_API_KEY_CONTENTS" || { echo 'Missing APPLE_API_KEY_CONTENTS'; exit 1; }
            export APPLE_API_KEY="$RUNNER_TEMP/notary-key.p8"
            printf '%s' "$APPLE_API_KEY_CONTENTS" > "$APPLE_API_KEY"
            chmod 600 "$APPLE_API_KEY"
            trap 'rm -f "$APPLE_API_KEY"' EXIT
          fi
          node scripts/verify-release.mjs --platform="$BUILD_PLATFORM"
          if [[ "$BUILD_PLATFORM" == mac ]]; then
            pnpm exec electron-builder --mac dmg zip --arm64 --x64 --publish never -c.forceCodeSigning=true
          else
            pnpm exec electron-builder --win nsis --x64 --publish never -c.forceCodeSigning=true
          fi
      - name: Upload packages without renaming update assets
        if: ${{ inputs.publish_release }}
        uses: actions/upload-artifact@v4
        with:
          name: mindex-${{ matrix.platform }}-${{ inputs.publish_release && 'signed' || 'test' }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.blockmap
            dist/latest*.yml
            dist/test/*.dmg
            dist/test/*.exe


  verify-intel:
    name: Verify installed Mac Intel candidate
    if: ${{ !inputs.publish_release }}
    needs: build
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      - run: python tools/broadcast-engine/prepare.py --target mac-x64
      - uses: actions/download-artifact@v4
        with:
          name: mindex-mac-test
          path: dist
      - name: Verify Intel launch, reinstall preservation and local RTMPS
        shell: bash
        run: |
          version="$(node -p 'require("./package.json").version')"
          test "$(node -p process.arch)" = x64
          npm install --prefix "$RUNNER_TEMP/mindex-qa" --ignore-scripts --no-audit --no-fund playwright@1.58.0
          export NODE_PATH="$(node -p 'require("path").join(process.env.RUNNER_TEMP, "mindex-qa", "node_modules")')"
          installer="dist/test/Mindex-Test-${version}-test-mac-x64.dmg"
          test -f "$installer"
          python tests/install_test_fixture.py "$installer" "$RUNNER_TEMP/intel-fixture.json"
          exe="$(node -p 'JSON.parse(require("fs").readFileSync(require("path").join(process.env.RUNNER_TEMP,"intel-fixture.json"))).exe')"
          resources="$(dirname "$(dirname "$exe")")/Resources"
          node tests/verify_candidate_package.cjs "$resources" mac-x64
          node tests/test_desktop_youtube_local.cjs "$exe" "$resources/broadcast-engine/ffmpeg"
          node tests/test_desktop_upgrade.cjs "$exe" "$RUNNER_TEMP/intel-proof.json" seed "$GITHUB_SHA" "${version}-test"
          node tests/test_desktop_upgrade.cjs "$exe" "$RUNNER_TEMP/intel-proof.json" restart "$GITHUB_SHA" "${version}-test"
          python tests/install_test_fixture.py "$installer" "$RUNNER_TEMP/intel-fixture.json"
          node tests/test_desktop_upgrade.cjs "$exe" "$RUNNER_TEMP/intel-proof.json" upgrade "$GITHUB_SHA" "${version}-test"
          node tests/test_desktop_upgrade.cjs "$exe" "$RUNNER_TEMP/intel-proof.json" restart "$GITHUB_SHA" "${version}-test"

      - name: Remove completed Intel TEST fixtures
        run: python tests/cleanup_desktop_ci.py intel-test
      - uses: actions/download-artifact@v4
        with:
          name: mindex-mac-internal
          path: dist/internal
      - name: Verify actual Intel church installer and preservation
        shell: bash
        run: |
          version="$(node -p 'require("./package.json").version')"
          export NODE_PATH="$(node -p 'require("path").join(process.env.RUNNER_TEMP, "mindex-qa", "node_modules")')"
          installer="dist/internal/Mindex-${version}-mac-x64.dmg"
          python tests/install_test_fixture.py "$installer" "$RUNNER_TEMP/intel-internal.json" internal
          exe="$(node -p 'JSON.parse(require("fs").readFileSync(require("path").join(process.env.RUNNER_TEMP,"intel-internal.json"))).exe')"
          resources="$(dirname "$(dirname "$exe")")/Resources"
          codesign --verify --deep --strict "$(dirname "$(dirname "$(dirname "$exe")")")"
          node tests/verify_candidate_package.cjs "$resources" mac-x64 internal
          node tests/test_desktop_youtube_local.cjs "$exe" "$resources/broadcast-engine/ffmpeg"
          node tests/test_desktop_upgrade.cjs "$exe" "$RUNNER_TEMP/intel-internal-proof.json" seed "$GITHUB_SHA" "$version"
          python tests/install_test_fixture.py "$installer" "$RUNNER_TEMP/intel-internal.json" internal
          node tests/test_desktop_upgrade.cjs "$exe" "$RUNNER_TEMP/intel-internal-proof.json" upgrade "$GITHUB_SHA" "$version"
          node tests/test_desktop_upgrade.cjs "$exe" "$RUNNER_TEMP/intel-internal-proof.json" restart "$GITHUB_SHA" "$version"
          python tests/cleanup_desktop_ci.py intel-internal
          python tests/verify_published_upgrade.py "$installer" mac-x64 "$GITHUB_SHA" "$version"

      - name: Retain Intel published-version upgrade receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: published-upgrade-intel
          path: ${{ runner.temp }}/published-upgrade-*/*proof.json
          if-no-files-found: warn
          retention-days: 14

  draft-release:
    if: ${{ inputs.publish_release }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: mindex-*-signed
          path: release-artifacts
          merge-multiple: true
      - name: Create draft for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="$(node -p 'require("./package.json").version')"
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo 'A release with this version already exists. Increment package.json version.' >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo 'Tag already exists. Use a new desktop version.' >&2
            exit 1
          fi
          test -f release-artifacts/latest-mac.yml
          test -f release-artifacts/latest.yml
          node -e 'const fs=require("fs"),p=require("./product-release.json");fs.writeFileSync("release-notes.md",p.changes.map(x=>"- "+x).join("\n")+"\n\n"+p.upgradeNotes+"\n\n소스: "+process.env.GITHUB_SHA+"\n")'
          gh release create "$tag" release-artifacts/* --target "$GITHUB_SHA" --draft --title "Mindex $tag" --notes-file release-notes.md

  internal-release:
    name: Publish verified church internal installers
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' && !inputs.publish_release }}
    needs: [build, verify-intel]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: mindex-*-internal
          path: release-artifacts
          merge-multiple: true
      - name: Publish immutable internal version after same-SHA web and native gates
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish-internal.py

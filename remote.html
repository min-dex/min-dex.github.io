<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff"><title>Mindex Remote</title>
<link rel="manifest" href="remote.webmanifest"><link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mindex Remote">
<link rel="stylesheet" href="remote.shared.css?v=2">
<link rel="stylesheet" href="remote.css?v=23">
<script>const theme=matchMedia("(prefers-color-scheme: dark)");function applyTheme(){document.documentElement.dataset.theme=theme.matches?"dark":"light";document.querySelector('meta[name="theme-color"]').content=theme.matches?"#181816":"#ffffff";}applyTheme();theme.addEventListener("change",applyTheme);</script>
</head>
<body>
<main>
<header><div class="brand"><span class="brand-mark" aria-hidden="true"></span><h1>Mindex Remote</h1></div><p id="status" role="status"></p></header>
<section id="adminOutputs" hidden aria-label="원격 연결 가능한 예배"><h2>예배 선택</h2><div id="outputList"></div></section>
<button id="adminLogout" hidden>관리자 접속 종료</button>
<form id="pairForm" hidden>
<div id="pairSelection" hidden><button id="chooseOutput" type="button"><i data-lucide="arrow-left"></i><span>예배 선택</span></button><strong id="pairTitle"></strong></div>
<label for="code">코드</label>
<input id="code" type="password" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="1234" maxlength="4" inputmode="numeric" pattern="[0-9]{4}" required>
<button id="connect" class="primary">연결</button>
</form>
<section id="controller" hidden aria-label="송출 조작">
<div id="adminContext" hidden><button id="backOutputs" type="button"><i data-lucide="arrow-left"></i><span>예배 선택</span></button><div class="selected-output"><strong id="selectedOutputTitle"></strong><span id="selectedOutputCode" class="output-code"></span></div></div>
<section class="current-slide" aria-label="현재 슬라이드 조작">
<h2>현재 <span id="position"></span></h2>
<div class="navigation"><button data-action="prev" aria-label="이전 슬라이드"><i data-lucide="chevron-left"></i></button><div id="current" class="slide-preview"></div><button data-action="next" class="primary" aria-label="다음 슬라이드"><i data-lucide="chevron-right"></i></button></div>
</section>
<details id="nextPreview"><summary>다음: <span id="nextTitle">마지막 슬라이드</span></summary><div id="next" class="slide-preview"></div></details>
<button id="slidesOpen" type="button" aria-expanded="false" aria-controls="slidesPanel"><i data-lucide="layout-grid"></i><span>예배 순서에서 이동</span></button>
<section id="slidesPanel" hidden aria-labelledby="slidesTitle">
<header><h2 id="slidesTitle">슬라이드 목록</h2><button id="slidesClose" type="button" aria-label="슬라이드 목록 접기"><i data-lucide="x"></i></button></header>
<form id="slidesSearch"><input id="slidesQuery" aria-label="슬라이드 검색" placeholder="제목·내용 검색" maxlength="80"><button type="submit">검색</button></form>
<button id="slideGroups" type="button" hidden>예배 순서로 돌아가기</button>
<p id="slidesStatus" role="status"></p><div id="slidesList"></div>
</section>
<section class="screen-management" aria-label="송출 화면 관리"><h2>송출 화면 관리</h2>
<div class="screen-actions">
<button data-action="output-stop" id="outputStop" hidden><i data-lucide="screen-share-off"></i><span>송출 종료</span></button>
<button data-action="output-fullscreen" title="데스크톱 앱에서 지원"><i data-lucide="maximize"></i><span>전체 화면</span></button>
<button data-action="output-pin" id="outputPin" title="데스크톱 앱에서 지원"><i data-lucide="pin"></i><span>항상 위</span></button>
<button data-action="blank" id="blank"><i data-lucide="eye-off"></i><span>암전</span></button>
<button data-action="transparent" id="transparent"><i data-lucide="layers"></i><span>투명</span></button>
</div></section>
<section class="remote-scripture" aria-labelledby="scriptureTitle"><h2 id="scriptureTitle">말씀</h2>
<p id="scriptureStatus" role="status"></p>
<form id="scriptureForm"><input id="scriptureQuery" aria-label="송출할 성구" placeholder="예: 요 3:16" maxlength="200" autocomplete="off"><div class="screen-actions"><button id="scriptureShow" type="submit">말씀 송출</button><button type="button" data-action="sermon-title">설교 제목으로</button></div></form>
<p id="scriptureFeedback" role="status" aria-live="polite"></p>
</section>
<section id="audioControls" aria-label="음원 조작"><h2>음원</h2><p id="audioBrowseHint" hidden>이 순서로 이동하면 조작할 수 있어요.</p><p id="music"></p>
<div class="audio"><button data-action="play"><i data-lucide="play"></i><span>재생</span></button><button data-action="pause"><i data-lucide="pause"></i><span>일시정지</span></button><button data-action="stop"><i data-lucide="square"></i><span>정지</span></button></div>
<button data-action="resume"><i data-lucide="rotate-ccw"></i><span>자동 넘김 복귀</span></button>
</section>
<section id="videoControls" aria-label="영상 조작"><h2>영상</h2><p id="videoBrowseHint" hidden>이 순서로 이동하면 조작할 수 있어요.</p><p id="videoStatus"></p>
<div class="audio"><button data-action="video-play"><i data-lucide="play"></i><span>재생</span></button><button data-action="video-pause"><i data-lucide="pause"></i><span>일시정지</span></button><button data-action="video-restart"><i data-lucide="rotate-ccw"></i><span>처음부터</span></button></div></section>
<p id="result" role="status" aria-live="polite"></p>
</section>
<button id="disconnect" hidden>원격 연결 종료</button>
<section class="phone-options" aria-label="화면 유지 상태" hidden>
<p id="screenStatus" role="status"></p><button id="screenRetry" hidden>화면 유지 다시 시도</button>

</section>
</main>

<script src="mindex.icons.js?v=remote-controls1"></script>
<script src="vendor/supabase-js.min.js"></script>
<script src="mindex.public-config.js"></script>
<script type="module" src="remote.mjs?v=35"></script>
</body></html>

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff"><title>Mindex Remote Controller</title>
<link rel="manifest" href="remote.webmanifest"><link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mindex Remote">
<link rel="stylesheet" href="remote.shared.css?v=2">
<link rel="stylesheet" href="remote.css?v=3">
<script>const theme=matchMedia("(prefers-color-scheme: dark)");function applyTheme(){document.documentElement.dataset.theme=theme.matches?"dark":"light";document.querySelector('meta[name="theme-color"]').content=theme.matches?"#181816":"#ffffff";}applyTheme();theme.addEventListener("change",applyTheme);</script>
</head>
<body>
<main>
<header><p class="brand">MINDEX</p><h1>Remote Controller</h1><p id="status" role="status">송출 PC의 연결 코드를 입력해 주세요.</p></header>
<form id="pairForm">
<label for="code">연결 코드</label>
<input id="code" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="123456" maxlength="6" inputmode="numeric" pattern="[0-9]{6}" required aria-describedby="codeHelp">
<p id="codeHelp">PC에서 ‘원격 → 연결 시작’ · 2분 안에 입력</p>
<button id="connect" class="primary">연결</button>
</form>
<section id="controller" hidden aria-label="송출 조작">
<div class="previews"><article><h2>현재 <span id="position"></span></h2><p id="current"></p></article><article><h2>다음</h2><p id="next"></p></article></div>
<div class="navigation"><button data-action="prev">← 이전</button><button data-action="next" class="primary">다음 →</button></div>
<button data-action="blank" id="blank">암전</button>
<h2>음원</h2><p id="music"></p>
<div class="audio"><button data-action="play">재생</button><button data-action="pause">일시정지</button><button data-action="stop">정지</button></div>
<button data-action="resume">자동 넘김 복귀</button>
<p id="result" role="status" aria-live="polite"></p>
</section>
<button id="disconnect" hidden>연결 종료</button>
<section class="phone-options" aria-label="폰 사용 설정">
<label class="check-row"><input id="keepAwake" type="checkbox" checked>연결 중 화면 꺼짐 방지</label>
<p id="screenStatus" role="status"></p><button id="screenRetry" hidden>화면 유지 다시 시도</button>
<details id="installHelp"><summary>홈 화면에서 앱처럼 열기</summary>
<p>iPhone·iPad: Safari의 공유 메뉴 → 홈 화면에 추가 → 웹 앱으로 열기.</p>
<p>Android: 브라우저 메뉴 → 앱 설치 또는 홈 화면에 추가.</p>
<p>홈 화면 아이콘으로 열어도 새 연결 코드를 입력해야 합니다.</p>
<button id="installApp" hidden>홈 화면에 설치</button></details>
</section>
<p class="foot">조작은 송출 PC에만 적용됩니다.</p>
</main>
<script src="vendor/supabase-js.min.js"></script>
<script src="mindex.public-config.js"></script>
<script type="module" src="remote.mjs?v=5"></script>
</body></html>
